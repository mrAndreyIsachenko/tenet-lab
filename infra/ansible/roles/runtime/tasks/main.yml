---
- name: Install base system packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - jq
      - xfsprogs
      - tmux
      - htop
      - rsync
      - ca-certificates
    state: present
    update_cache: true

- name: Check if s5cmd is installed
  ansible.builtin.command: which s5cmd
  register: s5cmd_check
  failed_when: false
  changed_when: false

- name: Install s5cmd for fast Nebius Object Storage sync
  ansible.builtin.shell: |
    set -euo pipefail
    TMP_DIR=$(mktemp -d)
    curl -fsSL "https://github.com/peak/s5cmd/releases/download/v{{ s5cmd_version }}/s5cmd_{{ s5cmd_version }}_Linux-64bit.tar.gz" -o "${TMP_DIR}/s5cmd.tar.gz"
    tar -xzf "${TMP_DIR}/s5cmd.tar.gz" -C "${TMP_DIR}" s5cmd
    install -m 0755 "${TMP_DIR}/s5cmd" /usr/local/bin/s5cmd
    rm -rf "${TMP_DIR}"
  args:
    executable: /bin/bash
  when: s5cmd_check.rc != 0

- name: Check if uv is installed
  ansible.builtin.command: which uv
  register: uv_check
  failed_when: false
  changed_when: false

- name: Install uv package manager
  ansible.builtin.shell: |
    set -euo pipefail
    curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
  args:
    executable: /bin/bash
  when: uv_check.rc != 0

- name: Check if nebius CLI is installed
  ansible.builtin.stat:
    path: /home/ubuntu/.nebius/bin/nebius
  register: nebius_bin

- name: Install nebius CLI
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sSL https://storage.eu-north1.nebius.cloud/cli/install.sh | bash -s -- -y
  args:
    executable: /bin/bash
  when: not nebius_bin.stat.exists
  become_user: "{{ tenet_user }}"

- name: Check for tenet-sa credentials on the Ansible controller
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.nebius/tenet-sa-credentials.json"
  delegate_to: localhost
  become: false
  register: sa_credentials_local

- name: Ensure .nebius directory exists on the VM
  ansible.builtin.file:
    path: /home/ubuntu/.nebius
    state: directory
    owner: "{{ tenet_user }}"
    group: "{{ tenet_user }}"
    mode: "0700"
  when: sa_credentials_local.stat.exists

- name: Copy tenet-sa credentials to the VM
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/.nebius/tenet-sa-credentials.json"
    dest: /home/ubuntu/.nebius/tenet-sa-credentials.json
    owner: "{{ tenet_user }}"
    group: "{{ tenet_user }}"
    mode: "0600"
  when: sa_credentials_local.stat.exists

- name: Create or update tenet-sa nebius CLI profile
  ansible.builtin.shell: |
    set -euo pipefail
    export PATH="$HOME/.nebius/bin:$PATH"
    if nebius profile list 2>/dev/null | grep -q tenet-sa; then
      nebius profile update tenet-sa \
        --service-account-file /home/ubuntu/.nebius/tenet-sa-credentials.json \
        --parent-id "{{ nebius_project_id }}"
    else
      nebius profile create tenet-sa \
        --endpoint api.nebius.cloud \
        --service-account-file /home/ubuntu/.nebius/tenet-sa-credentials.json \
        --parent-id "{{ nebius_project_id }}" </dev/null
    fi
  args:
    executable: /bin/bash
  when:
    - sa_credentials_local.stat.exists
    - nebius_project_id is defined
    - nebius_project_id | length > 0
  become_user: "{{ tenet_user }}"

- name: Sync Small Model Lab repository to /mnt/nvme/tenet-lab via rsync
  ansible.builtin.command:
    cmd: >-
      rsync -az --delete
      --exclude '.git' --exclude '.venv' --exclude '.terraform'
      --exclude 'results/*/models' --exclude '/shards' --exclude '/data'
      -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      "{{ playbook_dir }}/../../"
      "{{ tenet_user }}@{{ ansible_host }}:{{ tenet_workdir }}/"
  delegate_to: localhost
  become: false

- name: Write runtime .env file for Tenet v3
  ansible.builtin.template:
    src: env.j2
    dest: "{{ tenet_workdir }}/.env"
    owner: "{{ tenet_user }}"
    group: "{{ tenet_user }}"
    mode: "0600"

- name: Ensure .venv exists via uv sync if missing
  ansible.builtin.command:
    cmd: uv sync --extra data --extra parity --extra eval
    chdir: "{{ tenet_workdir }}"
    creates: "{{ tenet_workdir }}/.venv/bin/python"
  become_user: "{{ tenet_user }}"

- name: Ensure .venv ownership belongs to tenet_user
  ansible.builtin.file:
    path: "{{ tenet_workdir }}/.venv"
    state: directory
    owner: "{{ tenet_user }}"
    group: "{{ tenet_user }}"
    recurse: true

- name: Check if vllm, mlflow, and evalplus are installed in .venv
  ansible.builtin.command:
    cmd: "{{ tenet_workdir }}/.venv/bin/python -c 'import vllm, lm_eval, mlflow, evalplus'"
  become_user: "{{ tenet_user }}"
  register: runtime_pkg_check
  failed_when: false
  changed_when: false

- name: Install vllm, mlflow, and evalplus into .venv
  ansible.builtin.command:
    cmd: uv pip install vllm mlflow evalplus
    chdir: "{{ tenet_workdir }}"
  become_user: "{{ tenet_user }}"
  when: runtime_pkg_check.rc != 0

- name: Verify runtime Python packages (vllm, lm_eval, mlflow, evalplus)
  ansible.builtin.command:
    cmd: "{{ tenet_workdir }}/.venv/bin/python -c 'import vllm, lm_eval, mlflow, evalplus; print(\"runtime_ok\")'"
  become_user: "{{ tenet_user }}"
  register: runtime_verify
  changed_when: false
