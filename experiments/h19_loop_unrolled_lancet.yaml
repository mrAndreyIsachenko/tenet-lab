experiment_id: h19_loop_unrolled_lancet
hypothesis_id: H19
hypothesis: >
  Loop-Unrolled Tri-Anchor SCR & SVD-Compressed Multi-Pass Biprojection Lancet —
  hooking loop-unrolled layer executions (layer, tick), extracting per-tick
  contrastive directions, weighting them by a decaying per-execution weight
  (omega_t = K - t + 1), and SVD-compressing the 2-pass modified-Gram-Schmidt
  bi-projected targets to k_loop <= 2 directions achieves lower collateral KL
  than the full-rank unrolled concat (rank budget 2 vs 2*K = 6) while keeping
  anchor orthogonality error < 1e-5 and target orthonormality error < 1e-5.
prediction: >
  h19_effective_rank_per_layer <= 2.0, full_rank_unrolled_concat_effective_rank_per_layer == 6.0,
  h19_total_collateral_kl < full_rank_unrolled_concat_total_collateral_kl,
  anchor_orthogonality_error < 1e-5, target_orthonormality_error < 1e-5,
  max_row_norm_rel_drift <= 0.02.
acceptance_criterion: >
  h19_effective_rank_per_layer <= 2.0 AND full_rank_unrolled_concat_effective_rank_per_layer == 6.0 AND h19_total_collateral_kl < full_rank_unrolled_concat_total_collateral_kl AND anchor_orthogonality_error < 1e-5 AND target_orthonormality_error < 1e-5 AND max_row_norm_rel_drift <= 0.02
seed: 2026
model_config_path: configs/model/sml_nano.yaml
data_config_path: configs/data/tinystories.yaml
hardware_config_path: configs/hardware/m4_pro_mps.yaml
train:
  batch_size_tokens: 4096
  micro_batch_size: 2
  seq_len: 512
  max_steps: 27
  lr: 0.0005
  min_lr_ratio: 0.1
  weight_decay: 0.05
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  schedule: wsd
  warmup_steps: 2
  decay_fraction: 0.2
  precision: bf16
  compile: false
surgery:
  num_loop_repeats: 3
  loop_layer_range: [1, 3]
  k_loop: 2
  top_k_layers: 2
  lambda_cot: 0.5
  preserve_row_norm: true
  quant_snap: true
  quant_snap_iters: 4
  max_block16_crest_factor: 3.2
